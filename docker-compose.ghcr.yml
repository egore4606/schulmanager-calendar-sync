services:
  schulmanager-calendar:
    image: ${SCHULMANAGER_IMAGE:-ghcr.io/egore4606/schulmanager-calendar-sync:latest}
    container_name: schulmanager-calendar
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
