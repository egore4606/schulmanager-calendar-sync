version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type: dependencies"
      - "area: automation"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    labels:
      - "type: dependencies"
      - "area: container"
