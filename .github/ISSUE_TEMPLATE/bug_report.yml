name: Bug report
description: Report reproducible incorrect behavior without sharing private timetable data
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Never include tokens, Google keys, calendar IDs, names, school details, raw responses, schedule files, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, container tag, or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Schulmanager fetch/authentication
        - Schedule normalization
        - Google Calendar reconciliation
        - Docker/deployment
        - Health endpoint
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic values only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node/Docker version, and deployment method.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials and personal, calendar, school, teacher, and student information.
          required: true
        - label: I searched existing issues and tested the latest release.
          required: true
