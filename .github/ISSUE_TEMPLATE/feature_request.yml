name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - "type: enhancement"
  - "status: needs-triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and scope
      options:
        - label: The proposal does not require publishing or centrally storing user credentials or timetable data.
          required: true
        - label: I understand this is an unofficial integration with an undocumented upstream API.
          required: true
